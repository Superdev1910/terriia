{% load static %}<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Acceso{% endblock %} · Municipalidad de La Serena · TerriIA</title>
  <link rel="icon" type="image/png" href="{% static 'organizacion/img/favicon.png' %}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{% static 'organizacion/css/terriia.css' %}">
  <link rel="stylesheet" href="{% static 'organizacion/css/publico.css' %}">
</head>
<body>
  <div class="auth">
    <aside class="auth-lado" style="background-image: url('{% static 'organizacion/img/municipalidad.jpg' %}');" aria-hidden="true">
      <div class="auth-lado-in">
        <h2>TerriIA</h2>
        <p>Sistema de gestión de tareas de las delegaciones de la Municipalidad de La Serena.</p>
      </div>
    </aside>

    <main class="auth-main" id="contenido">
      <a class="auth-volver" href="{% url 'pub_inicio' %}"><i class="bi bi-arrow-left" aria-hidden="true"></i> Volver al sitio</a>
      <div class="auth-card">
        {% block formulario %}{% endblock %}
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.8/dist/sweetalert2.all.min.js"></script>
  <script src="{% static 'organizacion/js/auth.js' %}"></script>
</body>
</html>
