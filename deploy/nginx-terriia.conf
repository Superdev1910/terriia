# Copiar a /etc/nginx/conf.d/terriia.conf (Amazon Linux 2023) y recargar: sudo nginx -t && sudo systemctl reload nginx
# Gunicorn escucha en 127.0.0.1:8000 (ver deploy/gunicorn.service).
# Ajusta server_name y las rutas si el proyecto no está en /var/www/terriia.
#
# IMPORTANTE: HOY ESTE SERVIDOR ATIENDE SOLO POR HTTP (puerto 80). FALTA el certificado HTTPS.
# Mientras tanto la sesión y la contraseña viajan sin cifrar: usar solo en la red del proyecto/demo.
# Cuando exista el certificado: descomentar el bloque 443 de abajo, dejar el 80 solo para redirigir
# y poner DJANGO_HTTPS=True en el .env (cookies Secure, redirección y HSTS; ver .env.example).
# No se incluye ningún certificado ni clave aquí.

server {
    listen 80;
    server_name _;   # cambiar por el dominio o la IP pública

    # Evidencias de hasta 5 MB (más un margen para el formulario multipart).
    client_max_body_size 6m;

    # Archivos estáticos: salen de STATIC_ROOT (config/settings.py: BASE_DIR/static, tras collectstatic).
    location /static/ {
        alias /var/www/terriia/static/;
        expires 7d;
    }

    # Evidencias: SOLO accesibles por redirección interna desde Django (X-Accel-Redirect).
    # Una petición directa del navegador a /media/... responde 404.
    # En el .env del servidor: EVIDENCIAS_X_ACCEL_PREFIX=/media
    # Django responde con X-Accel-Redirect: /media/<ruta relativa del archivo> (la ruta es relativa a MEDIA_ROOT).
    location /media/ {
        internal;
        alias /var/www/terriia/media/;   # = MEDIA_ROOT (BASE_DIR/media)
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # NUM_PROXIES=1 en settings: Django toma la IP real desde este encabezado.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Con DEBUG=False Django confía en este encabezado para saber que la conexión era https.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

